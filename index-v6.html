<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UPIN v6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0a0e14;--panel:#111820;--border:#1e2a3a;--tp:#e6edf3;--td:#7d8590;--green:#3dcc6e;--red:#f06060;--amber:#e8a832;--cyan:#00e5ff;--blue:#3B82F6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Cascadia Code',monospace;background:var(--bg);color:var(--tp);font-size:11px;overflow-x:hidden}
#map{height:45vh;width:100%}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:8px;margin:4px}
.btn{font-family:inherit;font-size:10px;padding:8px 16px;border:2px solid;border-radius:4px;cursor:pointer;background:none;font-weight:700;letter-spacing:1px}
.btn-green{color:var(--green);border-color:var(--green)}
.btn-red{color:var(--red);border-color:var(--red)}
.btn-amber{color:var(--amber);border-color:var(--amber)}
.btn-cyan{color:var(--cyan);border-color:var(--cyan)}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:9px;font-weight:900;letter-spacing:2px}
.b-idle{background:#1e2a3a;color:var(--td)}
.b-rec{background:#0d3320;color:var(--green)}
.b-jam{background:#3d1515;color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.mc{background:var(--bg);border-radius:3px;padding:6px;text-align:center}
.ml{font-size:7px;color:var(--td);text-transform:uppercase;letter-spacing:1px}
.mv{font-size:18px;font-weight:900;margin:2px 0}
.mu{font-size:7px;color:var(--td)}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.sdot.live{background:var(--green)}.sdot.off{background:var(--td)}.sdot.err{background:var(--red)}
.log{font-size:8px;max-height:200px;overflow-y:auto;background:var(--bg);border-radius:3px;padding:4px;margin-top:4px}
.log div{padding:1px 0;border-bottom:1px solid var(--border)}
h2{font-size:12px;color:var(--cyan);letter-spacing:2px;margin-bottom:6px}
.alg-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)}
.alg-name{font-weight:700;font-size:9px}.alg-val{font-size:9px}
.conf-bar{height:4px;border-radius:2px;background:var(--border);margin-top:2px}
.conf-fill{height:100%;border-radius:2px}
</style>
</head>
<body>

<!-- ═══════════════════════ UI ═══════════════════════ -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border)">
  <div><b style="color:var(--cyan)">UPIN v6</b> <span class="badge b-idle" id="badge">IDLE</span></div>
  <div style="font-size:8px;color:var(--td)" id="clock"></div>
</div>

<div id="map"></div>

<!-- Controls -->
<div class="panel" id="controls">
  <div id="b1" style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-cyan" onclick="calibrate()">Calibrate</button>
    <button class="btn btn-green" onclick="startRec()">Start Recording</button>
    <select id="modeSelect" onchange="setMode(this.value)" style="font-family:inherit;font-size:9px;padding:4px;background:var(--bg);color:var(--tp);border:1px solid var(--border);border-radius:3px">
      <option value="static">Static</option>
      <option value="walk">Walking</option>
      <option value="car" selected>Car</option>
      <option value="train">Train</option>
    </select>
  </div>
  <div id="b2" style="display:none;gap:6px;flex-wrap:wrap">
    <button class="btn btn-red" onclick="jamGPS()">JAM GPS</button>
    <button class="btn btn-green" onclick="resurface()">RESURFACE</button>
    <button class="btn btn-amber" onclick="endTest()">End Test</button>
    <label style="font-size:8px;color:var(--td);display:flex;align-items:center;gap:4px">
      <input type="checkbox" id="autoDrill" onchange="AUTO_DRILL.enabled=this.checked"> Auto-Drill
    </label>
  </div>
</div>

<!-- Metrics -->
<div class="panel">
  <div class="grid3">
    <div class="mc"><div class="ml">Speed</div><div class="mv" id="mSpd">0</div><div class="mu">km/h (<span id="mSpdSrc">--</span>)</div></div>
    <div class="mc"><div class="ml">Heading</div><div class="mv" id="mHdg">--</div><div class="mu">deg</div></div>
    <div class="mc"><div class="ml">Distance</div><div class="mv" id="mDst">0</div><div class="mu">m</div></div>
  </div>
  <div class="grid3" style="margin-top:4px">
    <div class="mc"><div class="ml">Samples</div><div class="mv" id="mSmp">0</div><div class="mu">rec</div></div>
    <div class="mc"><div class="ml">Elapsed</div><div class="mv" id="mTime">0:00</div><div class="mu"> </div></div>
    <div class="mc"><div class="ml">Drills</div><div class="mv" id="mDrills">0</div><div class="mu">jams</div></div>
  </div>
</div>

<!-- Data Sources -->
<div class="panel">
  <h2>DATA SOURCES</h2>
  <div class="grid2">
    <div><span class="sdot off" id="dIMU"></span>IMU <span id="dIMUv" style="color:var(--td);font-size:8px"></span></div>
    <div><span class="sdot off" id="dBaro"></span>Baro <span id="dBarov" style="color:var(--td);font-size:8px"></span></div>
    <div><span class="sdot off" id="dGPS"></span>GPS <span id="dGPSv" style="color:var(--td);font-size:8px"></span></div>
    <div><span class="sdot off" id="dCell"></span>Cell <span id="dCellv" style="color:var(--td);font-size:8px"></span></div>
    <div><span class="sdot off" id="dWifi"></span>WiFi <span id="dWifiv" style="color:var(--td);font-size:8px"></span></div>
    <div><span class="sdot off" id="dBLE"></span>Board <span id="dBLEv" style="color:var(--td);font-size:8px"></span></div>
  </div>
</div>

<!-- 5 Algorithms -->
<div class="panel">
  <h2>6 POSITIONING ALGORITHMS</h2>
  <div id="algList"></div>
</div>

<!-- Fusion Output -->
<div class="panel">
  <h2>FUSION OUTPUT</h2>
  <div class="grid2">
    <div class="mc"><div class="ml">Position</div><div class="mv" id="fPos" style="font-size:11px">--</div></div>
    <div class="mc"><div class="ml">Confidence</div><div class="mv" id="fConf">--</div><div class="mu" id="fSrc">--</div></div>
  </div>
  <div class="mc" style="margin-top:4px"><div class="ml">Drift from GPS</div><div class="mv" id="fDrift" style="color:var(--amber)">--</div><div class="mu">meters</div></div>
</div>

<!-- Log -->
<div class="panel">
  <h2>LOG</h2>
  <div class="log" id="logBox"></div>
</div>

<!-- BLE Connect -->
<div class="panel" style="text-align:center">
  <button class="btn btn-cyan" onclick="connectBLE()" id="bleBtn">Connect Board (BLE)</button>
  <div style="font-size:8px;color:var(--td);margin-top:4px" id="bleStatus">Not connected</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// UPIN v6 — CLEAN LAYER-BY-LAYER BUILD
// Layer 1-2: Firmware (done)
// Layer 3: Data ingestion (this file)
// Layer 4: Data validation
// Layer 5: 5 positioning algorithms
// Layer 6: Fusion
// ═══════════════════════════════════════════════════════════

const VERSION='v6.0.1';

// ─── STATE ───
let phase='idle'; // idle | recording | jammed
let startTime=null, totalDist=0, drillCount=0;
let gpsSys=null, gpsTrue=null, drPos=null;
let accel={x:0,y:0,z:9.81}, gyro={x:0,y:0,z:0}, compass=0, mag={x:0,y:0,z:0};
let pressure=0, baroAlt=0, temp=0;
let boardConnected=false, bleDevice=null, bleChar=null;
let cellTowers=[], wifiAPs=[];
// Tower position database: learned from GPS when we see a CID
const towerDB={};
function learnTower(cid,lat,lon,signal){
  if(!cid||!lat||lat<1)return;
  if(!towerDB[cid])towerDB[cid]={lat,lon,signal,count:1};
  else{
    const t=towerDB[cid];
    t.lat=t.lat*0.9+lat*0.1;t.lon=t.lon*0.9+lon*0.1;
    t.signal=signal;t.count++;
  }
}
function enrichTowers(towers){
  return towers.map(t=>{
    const known=towerDB[t.cid];
    if(known)return{...t,lat:known.lat,lon:known.lon};
    return t;
  });
}
let mode='car'; // static|walk|car|train

// ─── LAYER 3: DATA INGESTION ───
const DATA={
  samples:[],
  MAX:12000,
  record(row){
    this.samples.push(row);
    if(this.samples.length>this.MAX)this.samples.shift();
  },
  count(){return this.samples.length;},
  last(){return this.samples.length?this.samples[this.samples.length-1]:null;}
};

// ─── LAYER 4: DATA VALIDATION ───
const L4={
  rejected:0, accepted:0,
  validate(row){
    if(Math.abs(row.ax)>30||Math.abs(row.ay)>30||Math.abs(row.az)>30){this.rejected++;return null;}
    if(row.gpsLat&&(row.gpsLat<-90||row.gpsLat>90)){this.rejected++;return null;}
    if(row.gpsLon&&(row.gpsLon<-180||row.gpsLon>180)){this.rejected++;return null;}
    this.accepted++;
    return row;
  }
};

// ─── LAYER 5: 5 POSITIONING ALGORITHMS ───
// Each: takes sensor data, returns {lat,lon,confidence,source} or null

const ALG={
  // Algorithm 1 — Cell Trilateration
  cellTri:{
    name:'Cell Trilateration',
    pos:null, confidence:0, source:'cell',
    predict(towers){
      if(!towers||towers.length<2)return null;
      const valid=towers.filter(t=>t.lat&&t.lon&&t.signal);
      if(valid.length<2)return null;
      let sLat=0,sLon=0,sW=0;
      valid.forEach(t=>{
        const w=Math.pow(10,(t.signal+50)/20); // higher RSSI = closer = more weight
        sLat+=t.lat*w;sLon+=t.lon*w;sW+=w;
      });
      if(sW<=0)return null;
      this.pos={lat:sLat/sW,lon:sLon/sW};
      this.confidence=Math.min(0.9,valid.length*0.2);
      return this.pos;
    }
  },

  // Algorithm 2 — Cell Direction (RSSI gradient)
  cellDir:{
    name:'Cell Direction',
    pos:null, confidence:0, source:'cell_rssi',
    _prev:new Map(),
    predict(towers,pos,speed,dt){
      if(!towers||!towers.length||!pos||speed<0.3)return null;
      let vLat=0,vLon=0,wTotal=0;
      towers.forEach(t=>{
        const key=t.cid||String(t.lat);
        const prev=this._prev.get(key);
        this._prev.set(key,t.signal);
        if(prev===undefined)return;
        const dRSSI=t.signal-prev;
        if(Math.abs(dRSSI)<0.5)return;
        const dLat=t.lat-pos.lat,dLon=t.lon-pos.lon;
        const dist=Math.sqrt(dLat*dLat+dLon*dLon);
        if(dist<0.0001)return;
        vLat+=dRSSI*dLat/dist;vLon+=dRSSI*dLon/dist;wTotal+=Math.abs(dRSSI);
      });
      if(wTotal<0.5)return null;
      const scale=speed*dt/(111320*Math.max(0.01,wTotal));
      this.pos={lat:pos.lat+vLat*scale,lon:pos.lon+vLon*scale/(Math.cos(pos.lat*Math.PI/180)||1)};
      this.confidence=Math.min(0.8,wTotal*0.1);
      return this.pos;
    }
  },

  // Algorithm 3 — WiFi Fingerprint
  wifiFP:{
    name:'WiFi Fingerprint',
    pos:null, confidence:0, source:'wifi',
    db:[], // [{lat,lon,bssids:[{bssid,rssi}]}]
    record(lat,lon,aps){
      if(!lat||!aps||!aps.length)return;
      this.db.push({lat,lon,bssids:aps.map(a=>({bssid:a.bssid||a.mac,rssi:a.rssi||a.signal}))});
      if(this.db.length>2000)this.db.shift();
    },
    predict(aps){
      if(!aps||!aps.length||this.db.length<5)return null;
      const current=new Map(aps.map(a=>[a.bssid||a.mac,a.rssi||a.signal]));
      let bestScore=-1,bestFP=null;
      this.db.forEach(fp=>{
        let matched=0,totalDiff=0;
        fp.bssids.forEach(b=>{
          const cur=current.get(b.bssid);
          if(cur!==undefined){matched++;totalDiff+=Math.abs(cur-b.rssi);}
        });
        if(matched>=2){
          const score=matched/(totalDiff+1);
          if(score>bestScore){bestScore=score;bestFP=fp;}
        }
      });
      if(!bestFP)return null;
      this.pos={lat:bestFP.lat,lon:bestFP.lon};
      this.confidence=Math.min(0.7,bestScore*0.3);
      return this.pos;
    }
  },

  // Algorithm 4 — IMU + Compass Dead Reckoning
  imuDR:{
    name:'IMU+Compass DR',
    pos:null, confidence:0, source:'imu',
    _speed:0,
    _accelBuf:[], _gyroBuf:[],
    predict(pos,accelData,gyroData,compassDeg,speed,dt,calBias){
      if(!pos)return null;
      const ax=accelData.x-(calBias?calBias.x:0);
      const ay=accelData.y-(calBias?calBias.y:0);
      const az=accelData.z-(calBias?calBias.z:0);
      const aMag=Math.sqrt(ax*ax+ay*ay+az*az);
      const gDiff=Math.abs(aMag-9.81);

      // ZUPT: proper multi-signal
      this._accelBuf.push(gDiff);if(this._accelBuf.length>20)this._accelBuf.shift();
      this._gyroBuf.push(Math.abs(gyroData.z-(calBias?calBias.gz:0)));if(this._gyroBuf.length>20)this._gyroBuf.shift();
      const aM=this._accelBuf.reduce((s,v)=>s+v,0)/this._accelBuf.length;
      const aStd=Math.sqrt(this._accelBuf.reduce((s,v)=>s+(v-aM)**2,0)/this._accelBuf.length);
      const gM=this._gyroBuf.reduce((s,v)=>s+v,0)/this._gyroBuf.length;
      const gStd=Math.sqrt(this._gyroBuf.reduce((s,v)=>s+(v-gM)**2,0)/this._gyroBuf.length);

      if(aStd<0.15&&gStd<0.3&&speed<0.5){
        this._speed=0;
      }else{
        if(speed>0.5)this._speed=speed; // use GPS/CID speed when available
        else if(gDiff>0.5)this._speed+=Math.min(gDiff-0.3,3)*dt*0.3;
        this._speed*=0.97; // decay
      }

      if(this._speed<0.1){
        this.confidence=0;
        if(pos)this.pos={lat:pos.lat,lon:pos.lon}; // keep position anchor for when movement starts
        return null;
      }
      const h=compassDeg*Math.PI/180;
      this.pos={
        lat:pos.lat+(this._speed*Math.cos(h)*dt)/111320,
        lon:pos.lon+(this._speed*Math.sin(h)*dt)/(111320*Math.cos(pos.lat*Math.PI/180))
      };
      this.confidence=Math.min(0.6,0.3+this._speed*0.02);
      return this.pos;
    }
  },

  // Algorithm 5 — Barometric Altitude
  baro:{
    name:'Pressure/Altitude',
    altitude:null, confidence:0, source:'baro',
    _lastP:0,
    predict(pressure,baroAlt){
      if(!pressure||pressure<300)return null;
      this.altitude=baroAlt||44330*(1-Math.pow(pressure/1013.25,0.1903));
      this._lastP=pressure;
      this.confidence=0.8;
      return{altitude:this.altitude};
    }
  },

  // Algorithm 6 — Fish School (genetic swarm)
  fish:{
    name:'Fish School',
    pos:null, confidence:0, source:'fish_swarm',
    schools:[], SCHOOLS:3, AGENTS:20, generation:0,

    init(lat,lon){
      this.schools=[];
      for(let s=0;s<this.SCHOOLS;s++){
        const agents=[];
        for(let a=0;a<this.AGENTS;a++){
          agents.push({
            dna:{velW:Math.random(),accelW:Math.random(),compassW:0.3+Math.random()*0.7,decay:0.95+Math.random()*0.04},
            pos:{lat,lon},fitness:0,err:999
          });
        }
        this.schools.push({agents,pos:{lat,lon},avgErr:999});
      }
      this.generation=0;
    },

    predict(pos,accelData,compassDeg,speed,dt,calBias){
      if(!this.schools.length||!pos)return null;
      // Each agent predicts independently
      this.schools.forEach(school=>{
        let sLat=0,sLon=0,sW=0;
        school.agents.forEach(ag=>{
          const d=ag.dna;
          const ax=(accelData.x-(calBias?calBias.x:0));
          const ay=(accelData.y-(calBias?calBias.y:0));
          const aEnergy=Math.sqrt(ax*ax+ay*ay);
          const s=speed*d.velW+aEnergy*d.accelW*0.1;
          const h=compassDeg*d.compassW*Math.PI/180;
          ag.pos={
            lat:ag.pos.lat+(s*Math.cos(h)*dt)/111320,
            lon:ag.pos.lon+(s*Math.sin(h)*dt)/(111320*Math.cos(ag.pos.lat*Math.PI/180))
          };
          ag.pos.lat=ag.pos.lat*(1-0.001)+pos.lat*0.001; // tiny anchor drift
          const w=Math.max(0.01,ag.fitness);
          sLat+=ag.pos.lat*w;sLon+=ag.pos.lon*w;sW+=w;
        });
        if(sW>0)school.pos={lat:sLat/sW,lon:sLon/sW};
      });
      // Best school output
      let bestS=this.schools[0];
      this.schools.forEach(s=>{if(s.avgErr<bestS.avgErr)bestS=s;});
      this.pos=bestS.pos?{lat:bestS.pos.lat,lon:bestS.pos.lon}:null;
      this.confidence=bestS.avgErr<999?Math.min(0.7,1/(bestS.avgErr+1)):0.1;
      return this.pos;
    },

    score(gps){
      if(!gps||!this.schools.length)return;
      this.schools.forEach(school=>{
        let totalErr=0,n=0;
        school.agents.forEach(ag=>{
          if(!ag.pos)return;
          ag.err=hav(ag.pos,gps);
          ag.fitness=1/(ag.err+0.1);
          ag.pos={lat:gps.lat,lon:gps.lon}; // reset to truth
          totalErr+=ag.err;n++;
        });
        school.avgErr=n>0?totalErr/n:999;
      });
      this.generation++;
      if(this.generation%10===0)this.evolve();
    },

    evolve(){
      this.schools.forEach(school=>{
        school.agents.sort((a,b)=>b.fitness-a.fitness);
        const n=school.agents.length;
        const kill=Math.floor(n*0.1);
        for(let i=0;i<kill;i++){
          const parent=school.agents[Math.floor(Math.random()*kill)];
          const child={
            dna:{
              velW:Math.max(0,Math.min(1,parent.dna.velW+(Math.random()-0.5)*0.1)),
              accelW:Math.max(0,Math.min(1,parent.dna.accelW+(Math.random()-0.5)*0.1)),
              compassW:Math.max(0.1,Math.min(1.5,parent.dna.compassW+(Math.random()-0.5)*0.1)),
              decay:Math.max(0.9,Math.min(0.999,parent.dna.decay+(Math.random()-0.5)*0.02))
            },
            pos:parent.pos?{...parent.pos}:{lat:0,lon:0},fitness:0,err:999
          };
          school.agents[n-1-i]=child;
        }
      });
    }
  }
};

// ─── LAYER 6: FUSION (strict priority cascade) ───
const FUSION={
  pos:null, confidence:0, source:'none', altitude:null,

  update(){
    // Try algorithms in confidence order — NO BLENDING
    if(ALG.cellTri.pos&&ALG.cellTri.confidence>0.5){
      this.pos={...ALG.cellTri.pos};this.confidence=ALG.cellTri.confidence;this.source='cellTri';return;
    }
    if(ALG.wifiFP.pos&&ALG.wifiFP.confidence>0.4){
      this.pos={...ALG.wifiFP.pos};this.confidence=ALG.wifiFP.confidence;this.source='wifiFP';return;
    }
    if(ALG.fish.pos&&ALG.fish.confidence>0.4){
      this.pos={...ALG.fish.pos};this.confidence=ALG.fish.confidence;this.source='fish';return;
    }
    if(ALG.imuDR.pos&&ALG.imuDR.confidence>0.3){
      this.pos={...ALG.imuDR.pos};this.confidence=ALG.imuDR.confidence;this.source='imuDR';return;
    }
    if(ALG.cellDir.pos&&ALG.cellDir.confidence>0.3){
      this.pos={...ALG.cellDir.pos};this.confidence=ALG.cellDir.confidence;this.source='cellDir';return;
    }
    // Nothing trustworthy — hold last position with decaying confidence
    if(this.pos)this.confidence=Math.max(0,this.confidence-0.01);
    else{this.confidence=0;this.source='none';}
    // Altitude always from baro
    if(ALG.baro.altitude!==null)this.altitude=ALG.baro.altitude;
  }
};

// ─── SPEED (strict priority, no blending) ───
let speedNow=0, speedSource='none';
function updateSpeed(){
  if(gpsSys&&gpsSys.speed>=0&&gpsSys.acc&&gpsSys.acc<50){
    speedNow=gpsSys.speed;speedSource='gps';return;
  }
  // CID speed would go here when Layer 7 CID tracking is added
  if(ALG.imuDR._speed>0.3&&ALG.imuDR._speed<15){
    speedNow=ALG.imuDR._speed;speedSource='imu';return;
  }
  speedNow=0;speedSource='none';
}

// ─── CALIBRATION ───
const CAL={bias:{x:0,y:0,z:0,gz:0},samples:[],
  addSample(){this.samples.push({ax:accel.x,ay:accel.y,az:accel.z,gz:gyro.z});},
  compute(){
    if(this.samples.length<20)return;
    this.bias.x=this.samples.reduce((s,d)=>s+d.ax,0)/this.samples.length;
    this.bias.y=this.samples.reduce((s,d)=>s+d.ay,0)/this.samples.length;
    this.bias.z=this.samples.reduce((s,d)=>s+d.az,0)/this.samples.length-9.81;
    this.bias.gz=this.samples.reduce((s,d)=>s+d.gz,0)/this.samples.length;
    this.samples=[];
  }
};

// ─── AUTO DRILL ───
const AUTO_DRILL={
  enabled:false,intervalMin:20,durationSec:60,minSpeedKmh:20,
  lastTime:0,count:0,
  tick(spdKmh,now){
    if(!this.enabled||phase!=='recording')return;
    if((now-this.lastTime)/60000<this.intervalMin)return;
    if(spdKmh<this.minSpeedKmh)return;
    this.lastTime=now;this.count++;
    jamGPS();
    setTimeout(()=>{if(phase==='jammed')resurface();},this.durationSec*1000);
  }
};

// ─── DEBUG LOG ───
const DEBUG=[];
function log(msg,color){
  const t=new Date().toLocaleTimeString();
  DEBUG.push({t,msg});if(DEBUG.length>100)DEBUG.shift();
  const el=document.getElementById('logBox');
  if(el){el.innerHTML='<div style="color:'+(color||'var(--tp)')+'">'+t+' '+msg+'</div>'+el.innerHTML;if(el.children.length>50)el.lastChild.remove();}
}

// ─── HAVERSINE ───
function hav(a,b){const R=6371000,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lon-a.lon)*Math.PI/180,x=Math.sin(dLa/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function fmt(s){const m=Math.floor(s/60);return m+':'+String(Math.floor(s%60)).padStart(2,'0');}

// ═══════════════════════════════════════════════════════════
// LAYER 3: BLE DATA INGESTION
// ═══════════════════════════════════════════════════════════
const BLE_SERVICE='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const BLE_TX_CHAR='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let bleBuffer='';
function connectBLE(){
  if(!navigator.bluetooth){log('Bluetooth not available','var(--red)');return;}
  log('Requesting BLE connection...','var(--cyan)');
  navigator.bluetooth.requestDevice({
    filters:[{name:'UPIN-BLE'}],
    optionalServices:[BLE_SERVICE]
  }).then(device=>{
    bleDevice=device;
    device.addEventListener('gattserverdisconnected',onBLEDrop);
    log('Device found: '+device.name+' — connecting GATT...','var(--cyan)');
    return device.gatt.connect();
  }).then(server=>{
    log('GATT connected — getting UART service...','var(--cyan)');
    return server.getPrimaryService(BLE_SERVICE);
  }).then(service=>{
    return service.getCharacteristic(BLE_TX_CHAR);
  }).then(char=>{
    bleChar=char;
    return char.startNotifications();
  }).then(()=>{
    bleChar.addEventListener('characteristicvaluechanged',onBLEData);
    boardConnected=true;
    document.getElementById('bleBtn').textContent='Board Connected ✓';
    document.getElementById('bleStatus').textContent='BLE active — 7 sensors';
    document.getElementById('dBLE').className='sdot live';document.getElementById('dBLEv').textContent='connected';
    log('BLE connected! Receiving sensor data','var(--green)');
    initPhoneSensors();initPhoneGPS();
  }).catch(err=>{
    const msg=err.message||String(err);
    log('BLE error: '+msg,'var(--red)');
    if(msg.includes('Service')){
      log('Try: power cycle the board, then reconnect','var(--amber)');
    }
  });
}

let _bleDropTime=0;
function onBLEDrop(){
  boardConnected=false;document.getElementById('dBLE').className='sdot err';
  const now=Date.now();
  if(now-_bleDropTime>5000)log('BLE dropped — reconnecting...','var(--amber)');
  _bleDropTime=now;
  setTimeout(()=>{if(bleDevice&&bleDevice.gatt)bleDevice.gatt.connect()
    .then(s=>s.getPrimaryService(BLE_SERVICE))
    .then(s=>s.getCharacteristic(BLE_TX_CHAR))
    .then(c=>{bleChar=c;c.startNotifications();c.addEventListener('characteristicvaluechanged',onBLEData);
      boardConnected=true;document.getElementById('dBLE').className='sdot live';
      if(Date.now()-_bleDropTime>3000)log('BLE reconnected','var(--green)');
    }).catch(()=>{setTimeout(onBLEDrop,3000);});
  },2000);
}

function onBLEData(e){
  const raw=new TextDecoder().decode(e.target.value);
  bleBuffer+=raw;
  // Strip keepalive packets
  bleBuffer=bleBuffer.replace(/\{"k":[^}]*\}\$/g,'');
  bleBuffer=bleBuffer.replace(/\{"k":[^}]*\}/g,'');
  // Firmware uses $ as packet delimiter, packets overlap in BLE chunks
  let found=true;
  while(found){
    found=false;
    const delimIdx=bleBuffer.indexOf('$');
    if(delimIdx>=0){
      const chunk=bleBuffer.substring(0,delimIdx);
      bleBuffer=bleBuffer.substring(delimIdx+1);
      const lastStart=chunk.lastIndexOf('{"t":');
      if(lastStart>=0){
        try{const d=JSON.parse(chunk.substring(lastStart));processBoardData(d);}catch(err){}
      }
      found=true;
    }
  }
  if(bleBuffer.length>10000)bleBuffer='';
}

function processBoardData(d){
  if(d.imu&&d.imu.ok){
    accel={x:d.imu.ax||0,y:d.imu.ay||0,z:d.imu.az||0};
    gyro={x:d.imu.gx||0,y:d.imu.gy||0,z:d.imu.gz||0};
    if(d.imu.mx!==undefined)mag={x:d.imu.mx||0,y:d.imu.my||0,z:d.imu.mz||0};
    // Compass: use firmware heading if available, else compute from magnetometer
    if(d.imu.hdg!==undefined&&d.imu.hdg!==0){
      compass=d.imu.hdg;
    }else if(mag.x!==0||mag.y!==0){
      compass=Math.atan2(mag.y,mag.x)*180/Math.PI;
      if(compass<0)compass+=360;
    }
    document.getElementById('dIMU').className='sdot live';
    document.getElementById('dIMUv').textContent='hdg:'+Math.round(compass)+'°';
  }
  // Barometer
  if(d.baro&&d.baro.ok){
    pressure=d.baro.hpa||0;temp=d.baro.temp||0;baroAlt=d.baro.alt||0;
    document.getElementById('dBaro').className='sdot live';
    document.getElementById('dBarov').textContent=pressure.toFixed(0)+'hPa';
  }
  // GPS (board GPS module)
  if(d.gps&&d.gps.ok&&d.gps.lat>1){
    const acc=(d.gps.hdop||2)*5;
    const fix={lat:d.gps.lat,lon:d.gps.lon,speed:d.gps.speed||0,acc:acc};
    gpsTrue=fix;
    if(phase!=='jammed')gpsSys=fix;
    document.getElementById('dGPS').className='sdot live';
    document.getElementById('dGPSv').textContent='±'+Math.round(acc)+'m';
  }
  // Cell modem (4G)
  if(d.cell4g&&d.cell4g.cid){
    const rssi=d.cell4g.rssi>0?-113+d.cell4g.rssi*2:(d.cell4g.rssi||-80);
    // Learn tower position from GPS when available
    if(gpsSys&&gpsSys.lat>1&&gpsSys.acc<100)learnTower(d.cell4g.cid,gpsSys.lat,gpsSys.lon,rssi);
    // Build tower list with known positions
    cellTowers=[{cid:d.cell4g.cid,mcc:d.cell4g.mcc||404,mnc:d.cell4g.mnc||0,tac:d.cell4g.tac||0,signal:rssi,lat:0,lon:0}];
    cellTowers=enrichTowers(cellTowers);
    // Also add 2G neighbor cells
    if(d.cell2g){
      const c2=d.cell2g.data||d.cell2g.list||[];
      if(Array.isArray(c2))c2.forEach(c=>{
        if(c.cid){
          if(gpsSys&&gpsSys.lat>1)learnTower(c.cid,gpsSys.lat,gpsSys.lon,c.rssi||-90);
          cellTowers.push({cid:c.cid,signal:c.rssi||-90,lat:0,lon:0});
        }
      });
      cellTowers=enrichTowers(cellTowers);
    }
    const knownCount=cellTowers.filter(t=>t.lat>1).length;
    document.getElementById('dCell').className='sdot live';
    document.getElementById('dCellv').textContent=knownCount+'/'+cellTowers.length+' towers';
  }
  // WiFi scan
  if(d.wifi){
    const list=d.wifi.list||d.wifi.data||[];
    if(list.length)wifiAPs=list;
    document.getElementById('dWifi').className='sdot live';
    document.getElementById('dWifiv').textContent=wifiAPs.length+' APs';
  }
}

// ─── PHONE GPS ───
function initPhoneGPS(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(
    p=>{
      const fix={lat:p.coords.latitude,lon:p.coords.longitude,speed:p.coords.speed||0,acc:p.coords.accuracy};
      gpsTrue=fix;
      if(phase!=='jammed')gpsSys=fix;
      document.getElementById('dGPS').className='sdot live';
      document.getElementById('dGPSv').textContent='±'+Math.round(fix.acc)+'m';
    },
    err=>{
      document.getElementById('dGPSv').textContent=err.code===1?'denied':err.code===3?'timeout':'error';
    },
    {enableHighAccuracy:true,maximumAge:2000,timeout:15000}
  );
}

// ─── PHONE SENSORS ───
function initPhoneSensors(){
  const sM=()=>window.addEventListener('devicemotion',e=>{
    if(e.accelerationIncludingGravity){accel={x:e.accelerationIncludingGravity.x||0,y:e.accelerationIncludingGravity.y||0,z:e.accelerationIncludingGravity.z||0};}
    if(e.rotationRate){gyro={x:e.rotationRate.alpha||0,y:e.rotationRate.beta||0,z:e.rotationRate.gamma||0};}
    document.getElementById('dIMU').className='sdot live';
  });
  const sO=()=>window.addEventListener('deviceorientation',e=>{if(e.alpha!==null)compass=e.alpha;});
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')DeviceMotionEvent.requestPermission().then(p=>{if(p==='granted')sM();});
  else if('DeviceMotionEvent' in window)sM();
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')DeviceOrientationEvent.requestPermission().then(p=>{if(p==='granted')sO();});
  else if('DeviceOrientationEvent' in window)sO();
}

// ═══════════════════════════════════════════════════════════
// MAIN TICK — 1 Hz
// ═══════════════════════════════════════════════════════════
let tickIv=null, uiFrame=0, lastPos=null;
const drills=[];

function tick(){
  const now=performance.now();
  const dt=1;
  uiFrame++;

  // Speed (strict cascade)
  updateSpeed();

  // Record data
  if(phase==='recording'||phase==='jammed'){
    const row={
      t:Date.now(), ax:accel.x, ay:accel.y, az:accel.z,
      gx:gyro.x, gy:gyro.y, gz:gyro.z,
      mx:mag.x, my:mag.y, mz:mag.z, compass,
      gpsLat:gpsSys?gpsSys.lat:0, gpsLon:gpsSys?gpsSys.lon:0,
      gpsSpd:gpsSys?gpsSys.speed:0, gpsAcc:gpsSys?gpsSys.acc:999,
      pressure, baroAlt, cellTowers:[...cellTowers], wifiAPs:[...wifiAPs],
      speedNow, speedSource, phase
    };

    // Layer 4: validate (flag bad data, but ALWAYS record the row)
    const l4=L4.validate(row);
    if(!l4)row._l4_rejected=true; else Object.assign(row,l4);

    // ALWAYS record — even with nulls. Missing data = null, not missing row.
    DATA.record(row);

    // Layer 5: run all 5 algorithms
    const pos=FUSION.pos||gpsSys||(gpsTrue?{lat:gpsTrue.lat,lon:gpsTrue.lon}:null);
    ALG.cellTri.predict(cellTowers);
    ALG.cellDir.predict(cellTowers,pos,speedNow,dt);
    if(gpsSys&&phase==='recording')ALG.wifiFP.record(gpsSys.lat,gpsSys.lon,wifiAPs);
    ALG.wifiFP.predict(wifiAPs);
    ALG.imuDR.predict(pos,accel,gyro,compass,speedNow,dt,CAL.bias);
    ALG.baro.predict(pressure,baroAlt);
    // Fish School: init on first GPS, predict always, score when GPS available
    if(!ALG.fish.schools.length&&gpsSys&&gpsSys.lat>1)ALG.fish.init(gpsSys.lat,gpsSys.lon);
    if(ALG.fish.schools.length)ALG.fish.predict(pos,accel,compass,speedNow,dt,CAL.bias);
    if(gpsSys&&gpsSys.lat>1&&ALG.fish.schools.length)ALG.fish.score(gpsSys);

    // Layer 6: fusion
    FUSION.update();

    // Snapshot algorithm outputs into the row
    row.ct_lat=ALG.cellTri.pos?ALG.cellTri.pos.lat:null;
    row.ct_lon=ALG.cellTri.pos?ALG.cellTri.pos.lon:null;
    row.ct_conf=ALG.cellTri.confidence;
    row.cd_lat=ALG.cellDir.pos?ALG.cellDir.pos.lat:null;
    row.cd_lon=ALG.cellDir.pos?ALG.cellDir.pos.lon:null;
    row.cd_conf=ALG.cellDir.confidence;
    row.wf_lat=ALG.wifiFP.pos?ALG.wifiFP.pos.lat:null;
    row.wf_lon=ALG.wifiFP.pos?ALG.wifiFP.pos.lon:null;
    row.wf_conf=ALG.wifiFP.confidence;
    row.dr_lat=ALG.imuDR.pos?ALG.imuDR.pos.lat:null;
    row.dr_lon=ALG.imuDR.pos?ALG.imuDR.pos.lon:null;
    row.dr_conf=ALG.imuDR.confidence;
    row.pa_alt=ALG.baro.altitude;
    row.fish_lat=ALG.fish.pos?ALG.fish.pos.lat:null;
    row.fish_lon=ALG.fish.pos?ALG.fish.pos.lon:null;
    row.fish_conf=ALG.fish.confidence;
    row.fused_lat=FUSION.pos?FUSION.pos.lat:null;
    row.fused_lon=FUSION.pos?FUSION.pos.lon:null;
    row.fused_conf=FUSION.confidence;
    row.fused_src=FUSION.source;

    // Distance
    if(FUSION.pos&&lastPos){
      const dd=hav(lastPos,FUSION.pos);
      if(dd>0.5&&dd<250)totalDist+=dd;
      else{const sd=speedNow*dt;if(sd>0.5&&sd<250)totalDist+=sd;}
    }
    if(FUSION.pos)lastPos={lat:FUSION.pos.lat,lon:FUSION.pos.lon};

    // drPos for denial
    if(phase==='jammed'&&FUSION.pos)drPos=FUSION.pos;
    if(phase==='recording'&&gpsSys)drPos={lat:gpsSys.lat,lon:gpsSys.lon};

    // Auto-drill
    AUTO_DRILL.tick(speedNow*3.6,now);

    // Auto-save every 5 min
    if(uiFrame%300===0)autoSave();

    // MAP: draw position
    const mapPos=gpsSys||FUSION.pos||drPos;
    if(mapPos&&mapPos.lat>1&&typeof L!=='undefined'){
      const ll=[mapPos.lat,mapPos.lon];
      const isJam=phase==='jammed';
      const col=isJam?'#FFB800':'#00FF88';
      if(!marker){
        map.setView(ll,16);
        marker=L.circleMarker(ll,{radius:8,color:col,fillColor:col,fillOpacity:1,weight:2}).addTo(map);
      }else{
        marker.setLatLng(ll);
        marker.setStyle({color:col,fillColor:col});
      }

      // GPS accuracy circle
      if(gpsSys&&gpsSys.acc&&!isJam){
        if(!gpsAccCircle)gpsAccCircle=L.circle(ll,{radius:gpsSys.acc,color:'#00FF88',fillOpacity:0.05,weight:1,dashArray:'4,4'}).addTo(map);
        else{gpsAccCircle.setLatLng(ll);gpsAccCircle.setRadius(gpsSys.acc);}
      }
      if(isJam&&gpsAccCircle){map.removeLayer(gpsAccCircle);gpsAccCircle=null;}

      // Uncertainty cone: grows during denial
      if(isJam){
        coneRadius+=(speedNow||1)*dt;
        if(!coneCircle)coneCircle=L.circle(ll,{radius:coneRadius,color:'#00e5ff',fillOpacity:0.04,weight:1,dashArray:'6,4'}).addTo(map);
        else{coneCircle.setLatLng(ll);coneCircle.setRadius(coneRadius);}
      }else{
        coneRadius=gpsSys?gpsSys.acc||10:10;
        if(coneCircle){map.removeLayer(coneCircle);coneCircle=null;}
      }

      // Trail — green for GPS, orange for denied
      drTrail.push(ll);if(drTrail.length>500)drTrail.shift();
      if(drLine){drLine.setLatLngs(drTrail);drLine.setStyle({color:col});}
      else drLine=L.polyline(drTrail,{color:col,weight:3,opacity:0.7}).addTo(map);

      // GPS truth marker during denial (small purple dot shows real position)
      if(isJam&&gpsTrue&&gpsTrue.lat>1){
        const tll=[gpsTrue.lat,gpsTrue.lon];
        if(!truthMarker)truthMarker=L.circleMarker(tll,{radius:4,color:'#A855F7',fillColor:'#A855F7',fillOpacity:0.8,weight:1}).addTo(map);
        else truthMarker.setLatLng(tll);
      }else if(!isJam&&truthMarker){map.removeLayer(truthMarker);truthMarker=null;}
    }
  }

  // Even outside recording: show GPS on map if available
  if(phase==='idle'&&gpsSys&&gpsSys.lat>1&&typeof L!=='undefined'){
    const ll=[gpsSys.lat,gpsSys.lon];
    if(!marker){map.setView(ll,16);marker=L.circleMarker(ll,{radius:8,color:'#00FF88',fillColor:'#00FF88',fillOpacity:1,weight:2}).addTo(map);}
    else marker.setLatLng(ll);
    if(gpsSys.acc){
      if(!gpsAccCircle)gpsAccCircle=L.circle(ll,{radius:gpsSys.acc,color:'#00FF88',fillOpacity:0.05,weight:1,dashArray:'4,4'}).addTo(map);
      else{gpsAccCircle.setLatLng(ll);gpsAccCircle.setRadius(gpsSys.acc);}
    }
  }

  // Update UI
  updateUI();
}

function updateUI(){
  document.getElementById('mSpd').textContent=Math.round(speedNow*3.6);
  document.getElementById('mSpdSrc').textContent=speedSource;
  document.getElementById('mHdg').textContent=Math.round(compass)+'°';
  document.getElementById('mDst').textContent=Math.round(totalDist);
  document.getElementById('mSmp').textContent=DATA.count();
  document.getElementById('mDrills').textContent=drills.length;
  if(startTime)document.getElementById('mTime').textContent=fmt((performance.now()-startTime)/1000);
  document.getElementById('clock').textContent=new Date().toLocaleTimeString();

  // Algorithm display
  let algHTML='';
  [ALG.cellTri,ALG.cellDir,ALG.wifiFP,ALG.imuDR,ALG.baro,ALG.fish].forEach(a=>{
    const conf=Math.round(a.confidence*100);
    const col=conf>50?'var(--green)':conf>20?'var(--amber)':'var(--td)';
    const posStr=a.pos?a.pos.lat.toFixed(5)+','+a.pos.lon.toFixed(5):(a.altitude!==null?a.altitude.toFixed(1)+'m':'--');
    algHTML+='<div class="alg-row"><span class="alg-name">'+a.name+'</span><span class="alg-val" style="color:'+col+'">'+posStr+' ('+conf+'%)</span></div>';
  });
  document.getElementById('algList').innerHTML=algHTML;

  // Fusion
  if(FUSION.pos){
    document.getElementById('fPos').textContent=FUSION.pos.lat.toFixed(5)+', '+FUSION.pos.lon.toFixed(5);
    document.getElementById('fConf').textContent=Math.round(FUSION.confidence*100)+'%';
    document.getElementById('fSrc').textContent=FUSION.source;
  }
  if(FUSION.pos&&gpsTrue){
    const drift=hav(FUSION.pos,gpsTrue);
    document.getElementById('fDrift').textContent=Math.round(drift)+'m';
    document.getElementById('fDrift').style.color=drift<50?'var(--green)':drift<200?'var(--amber)':'var(--red)';
  }
}

// ─── CONTROLS ───
function calibrate(){
  log('Calibrating — hold still 3s','var(--amber)');
  const iv=setInterval(()=>CAL.addSample(),100);
  setTimeout(()=>{clearInterval(iv);CAL.compute();log('Calibrated: bias='+CAL.bias.x.toFixed(2)+','+CAL.bias.y.toFixed(2),'var(--green)');},3000);
}

function startRec(){
  phase='recording';startTime=performance.now();totalDist=0;uiFrame=0;lastPos=null;
  DATA.samples=[];drills.length=0;
  document.getElementById('badge').textContent='RECORDING';document.getElementById('badge').className='badge b-rec';
  document.getElementById('b1').style.display='none';document.getElementById('b2').style.display='flex';
  if(!tickIv)tickIv=setInterval(tick,1000);
  log('Recording started','var(--green)');
}

function jamGPS(){
  if(phase!=='recording')return;
  phase='jammed';drillCount++;
  gpsSys=null;
  document.getElementById('badge').textContent='GPS DENIED';document.getElementById('badge').className='badge b-jam';
  document.getElementById('dGPS').className='sdot err';document.getElementById('dGPSv').textContent='BLOCKED';
  log('GPS JAMMED — all formulas on their own','var(--red)');
  drills.push({start:performance.now(),startPos:drPos?{...drPos}:null,drift:0,winner:'',endPos:null});
}

function resurface(){
  if(phase!=='jammed')return;
  phase='recording';
  const drill=drills[drills.length-1];
  if(drill){
    drill.endPos=gpsTrue?{...gpsTrue}:null;
    drill.duration=Math.round((performance.now()-drill.start)/1000);
    if(drill.endPos&&FUSION.pos)drill.drift=Math.round(hav(FUSION.pos,drill.endPos));
    let bestAlg='none',bestConf=0;
    [ALG.cellTri,ALG.cellDir,ALG.wifiFP,ALG.imuDR].forEach(a=>{if(a.confidence>bestConf){bestConf=a.confidence;bestAlg=a.name;}});
    drill.winner=bestAlg;
    log('RESURFACE — drift: '+drill.drift+'m, winner: '+drill.winner,'var(--green)');
  }
  document.getElementById('badge').textContent='RECORDING';document.getElementById('badge').className='badge b-rec';
}

function endTest(){
  phase='idle';if(tickIv){clearInterval(tickIv);tickIv=null;}
  document.getElementById('badge').textContent='IDLE';document.getElementById('badge').className='badge b-idle';
  document.getElementById('b1').style.display='flex';document.getElementById('b2').style.display='none';
  exportCSV();
  log('Test ended — '+DATA.count()+' samples, '+drills.length+' drills','var(--cyan)');
}

function setMode(m){mode=m;log('Mode: '+m,'var(--cyan)');}

// ─── CSV EXPORT ───
function exportCSV(){
  // Layer 3 columns + Layer 5 per-algorithm columns + Layer 6 fusion columns
  let csv='Time,Phase,AccelX,AccelY,AccelZ,GyroX,GyroY,GyroZ,Compass,GPS_Lat,GPS_Lon,GPS_Speed,GPS_Acc,Pressure,BaroAlt,Speed_Now,Speed_Source,CT_Lat,CT_Lon,CT_Conf,CD_Lat,CD_Lon,CD_Conf,WF_Lat,WF_Lon,WF_Conf,DR_Lat,DR_Lon,DR_Conf,PA_Alt,Fish_Lat,Fish_Lon,Fish_Conf,Fused_Lat,Fused_Lon,Fused_Conf,Fused_Src\n';
  DATA.samples.forEach(s=>{
    const n=v=>v!==null&&v!==undefined?v:'';
    const f=(v,d)=>v!==null&&v!==undefined?Number(v).toFixed(d):'';
    csv+=s.t+','+s.phase+','+s.ax.toFixed(3)+','+s.ay.toFixed(3)+','+s.az.toFixed(3)+',';
    csv+=s.gx.toFixed(2)+','+s.gy.toFixed(2)+','+s.gz.toFixed(2)+','+s.compass.toFixed(1)+',';
    csv+=s.gpsLat.toFixed(7)+','+s.gpsLon.toFixed(7)+','+(s.gpsSpd||0).toFixed(1)+','+(s.gpsAcc||999).toFixed(0)+',';
    csv+=(s.pressure||0).toFixed(1)+','+(s.baroAlt||0).toFixed(1)+',';
    csv+=(s.speedNow*3.6).toFixed(1)+','+s.speedSource+',';
    csv+=f(s.ct_lat,7)+','+f(s.ct_lon,7)+','+f(s.ct_conf,2)+',';
    csv+=f(s.cd_lat,7)+','+f(s.cd_lon,7)+','+f(s.cd_conf,2)+',';
    csv+=f(s.wf_lat,7)+','+f(s.wf_lon,7)+','+f(s.wf_conf,2)+',';
    csv+=f(s.dr_lat,7)+','+f(s.dr_lon,7)+','+f(s.dr_conf,2)+',';
    csv+=f(s.pa_alt,1)+',';
    csv+=f(s.fish_lat,7)+','+f(s.fish_lon,7)+','+f(s.fish_conf,2)+',';
    csv+=f(s.fused_lat,7)+','+f(s.fused_lon,7)+','+f(s.fused_conf,2)+','+n(s.fused_src)+'\n';
  });

  // KPI Report
  csv+='\n# ===== UPIN v6 KPI REPORT =====\n';
  csv+='# Version: '+VERSION+'\n';
  csv+='# Duration_s: '+Math.round((performance.now()-startTime)/1000)+'\n';
  csv+='# Total_distance_m: '+Math.round(totalDist)+'\n';
  csv+='# Samples: '+DATA.count()+'\n';
  csv+='# L4_accepted: '+L4.accepted+'\n';
  csv+='# L4_rejected: '+L4.rejected+'\n';
  csv+='# Fish_generations: '+ALG.fish.generation+'\n';
  csv+='# Fish_schools: '+ALG.fish.schools.length+'\n';
  csv+='# Fish_best_err: '+(ALG.fish.schools.length?Math.min(...ALG.fish.schools.map(s=>s.avgErr)).toFixed(1):'--')+'\n';
  csv+='# Drills: '+drills.length+'\n';
  drills.forEach((d,i)=>{
    csv+='# Drill_'+(i+1)+'_duration_s: '+(d.duration||0)+'\n';
    csv+='# Drill_'+(i+1)+'_drift_m: '+(d.drift||0)+'\n';
    csv+='# Drill_'+(i+1)+'_winner: '+(d.winner||'none')+'\n';
  });

  // Debug log
  csv+='\n# ===== DEBUG LOG =====\n';
  DEBUG.slice(-50).forEach(d=>{csv+='# '+d.t+' '+d.msg+'\n';});

  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='UPIN_v6_'+new Date().toISOString().replace(/[:.]/g,'').substring(0,15)+'.csv';
  a.click();log('CSV exported: '+DATA.count()+' rows','var(--green)');
}

function autoSave(){
  try{
    const csv='UPIN v6 autosave at '+new Date().toISOString()+'\nSamples: '+DATA.count()+'\nDrills: '+drills.length;
    localStorage.setItem('upin_v6_autosave',csv);
    localStorage.setItem('upin_v6_autosave_time',Date.now().toString());
  }catch(e){}
}
